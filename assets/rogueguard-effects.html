<style>
/* Keep the real browser cursor visible for predictable, accessible interaction.
   A small halo follows it; text fields keep their normal I-beam cursor. */
#rg-cursor-ring {
  position:fixed; left:-100px; top:-100px; z-index:2147483646;
  width:16px; height:16px; border:1.5px solid #526d32; border-radius:50%;
  background:rgba(201,243,106,.10);
  box-shadow:0 0 0 2px rgba(23,25,27,.12);
  pointer-events:none; transform:translate3d(-50%,-50%,0);
  transition:width .16s ease,height .16s ease,background .16s ease,border-color .16s ease;
  will-change:left,top;
}
#rg-cursor-ring:after {
  content:""; position:absolute; left:50%; top:50%; width:3px; height:3px;
  border-radius:50%; background:#28321c; transform:translate(-50%,-50%);
}
#rg-cursor-ring.rg-cursor-hover {
  width:26px; height:26px; border-color:#27331a;
  background:rgba(201,243,106,.2);
  box-shadow:0 0 0 3px rgba(201,243,106,.14);
}
#rg-cursor-spotlight {
  position:fixed; z-index:2147483645; left:-1000px; top:-1000px;
  width:300px; height:300px; border-radius:50%; pointer-events:none;
  transform:translate3d(-50%,-50%,0);
  background:radial-gradient(circle,rgba(201,243,106,.12) 0%,rgba(201,243,106,.045) 32%,transparent 68%);
  will-change:left,top;
}
#rg-boot-screen {
  position:fixed; inset:0; z-index:2147483647; display:flex; align-items:center;
  justify-content:center; background:#17191b; color:#f5f4ed;
  transition:opacity .55s ease,visibility .55s ease;
}
#rg-boot-screen.rg-boot-out { opacity:0; visibility:hidden; pointer-events:none; }
#rg-boot-screen .rg-boot-inner { width:min(520px,82vw); }
#rg-boot-screen .rg-boot-mark {
  color:#c9f36a; font:900 4rem/.85 "Barlow Condensed",Impact,sans-serif; letter-spacing:-.04em;
}
#rg-boot-screen .rg-boot-label {
  margin-top:1.2rem; color:#c5c8c7; font:700 .65rem "IBM Plex Mono",monospace; letter-spacing:.18em;
}
#rg-boot-screen .rg-boot-track { height:3px; background:#44494a; margin-top:1.4rem; overflow:hidden; }
#rg-boot-screen .rg-boot-progress {
  height:100%; width:0; background:#c9f36a;
  animation:rg-boot-progress 1.35s cubic-bezier(.7,0,.2,1) forwards;
}
@keyframes rg-boot-progress { to { width:100%; } }
@keyframes rg-reveal {
  from { opacity:0; transform:translateY(22px); filter:blur(7px); }
  to { opacity:1; transform:translateY(0); filter:blur(0); }
}
@keyframes rg-chrome-float {
  0%,100% { transform:translateY(0) rotate(-4deg); }
  50% { transform:translateY(-13px) rotate(5deg); }
}
@keyframes rg-ring-spin { to { transform:rotate(332deg); } }
@keyframes rg-pulse {
  0%,100% { box-shadow:0 0 0 0 rgba(201,243,106,0); }
  50% { box-shadow:0 0 0 7px rgba(201,243,106,.18); }
}
@keyframes rg-scan { from { transform:translateX(-110%); } to { transform:translateX(220%); } }
.rg-hero, .rg-panel, .rg-stat, .rg-detail, .rg-masthead, .rg-safety, .rg-context {
  animation:rg-reveal .72s cubic-bezier(.2,.75,.25,1) both;
}
.rg-hero { animation-delay:.08s; transition:box-shadow .25s ease,border-color .25s ease; }
.rg-hero:hover { box-shadow:9px 10px 0 #17191b; border-color:#718b43; }
.rg-safety { animation-delay:.16s; }
.rg-context { animation-delay:.22s; }
.rg-stat { transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease; }
.rg-stat:hover { transform:translateY(-6px) rotate(-.3deg); box-shadow:7px 8px 0 rgba(23,25,27,.2); border-color:#6e873f; }
.rg-panel { transition:transform .24s ease,box-shadow .24s ease; }
.rg-panel:hover { transform:translateY(-4px); box-shadow:7px 8px 0 rgba(23,25,27,.19); }
.rg-chrome { animation:rg-chrome-float 6s ease-in-out infinite; transition:transform .22s ease; will-change:transform; }
.rg-chrome:before { animation:rg-ring-spin 12s linear infinite; }
.rg-live { animation:rg-pulse 3s ease-in-out infinite; }
.rg-bar-fill { position:relative; overflow:hidden; }
.rg-bar-fill:after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
  animation:rg-scan 3.3s ease-in-out infinite;
}
.rg-relationship { transition:transform .2s ease,background .2s ease,box-shadow .2s ease; }
.rg-relationship:hover { transform:translateX(5px); background:#fff; box-shadow:4px 4px 0 rgba(23,25,27,.14); }
.rg-node { transition:transform .18s ease,background .18s ease; }
.rg-node:hover { transform:scale(1.025); background:#edfacf; }
[data-testid="stTabs"] button[role="tab"] { transition:transform .18s ease,background .18s ease; }
[data-testid="stTabs"] button[role="tab"]:hover { transform:translateY(-3px); }
[data-testid="stButton"] button, [data-testid="stFormSubmitButton"] button, [data-testid="stDownloadButton"] button {
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease !important;
}
[data-testid="stButton"] button:hover, [data-testid="stFormSubmitButton"] button:hover, [data-testid="stDownloadButton"] button:hover {
  transform:translate(-2px,-2px) !important; box-shadow:6px 6px 0 rgba(23,25,27,.28) !important;
}
@media (prefers-reduced-motion:reduce) {
  *, *:before, *:after {
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    scroll-behavior:auto !important; transition-duration:.01ms !important;
  }
  #rg-cursor-spotlight { display:none !important; }
}
</style>
<script>
(() => {
  const start = () => {
    if (window.__rogueGuardPointerBound) return;
    try {
      const bootKey = "rogueguard.boot.v3";
      if (!window.sessionStorage.getItem(bootKey)) {
        window.sessionStorage.setItem(bootKey,"1");
        const boot = document.createElement("div");
        boot.id = "rg-boot-screen";
        boot.innerHTML = '<div class="rg-boot-inner"><div class="rg-boot-mark">RG /</div><div class="rg-boot-label">ROGUEGUARD // INITIALISING LOCAL WORKSPACE</div><div class="rg-boot-track"><div class="rg-boot-progress"></div></div></div>';
        document.body.appendChild(boot);
        window.setTimeout(() => boot.classList.add("rg-boot-out"),1450);
        window.setTimeout(() => boot.remove(),2100);
      }
    } catch (error) {
      /* Private browsing may disable storage; continue without the intro overlay. */
    }

    const pointer = document.createElement("div");
    pointer.id = "rg-cursor-ring";
    const spotlight = document.createElement("div");
    spotlight.id = "rg-cursor-spotlight";
    document.body.appendChild(spotlight);
    document.body.appendChild(pointer);

    const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const onMove = (event) => {
      if (event.pointerType === "touch") return;
      pointer.style.left = event.clientX + "px";
      pointer.style.top = event.clientY + "px";
      spotlight.style.left = event.clientX + "px";
      spotlight.style.top = event.clientY + "px";
      const target = event.target instanceof Element ? event.target : null;
      const chrome = target && target.closest(".rg-chrome");
      if (chrome && !reducedMotion) {
        const rect = chrome.getBoundingClientRect();
        const x = (event.clientX - rect.left) / Math.max(rect.width,1) - .5;
        const y = (event.clientY - rect.top) / Math.max(rect.height,1) - .5;
        chrome.style.transform = "perspective(700px) rotateX(" + (-y * 14) + "deg) rotateY(" + (x * 18) + "deg) scale(1.045)";
      } else {
        document.querySelectorAll(".rg-chrome").forEach((item) => { item.style.transform = ""; });
      }
      if (target && target.closest("button, a, [role='tab'], .rg-node, input, textarea")) {
        pointer.classList.add("rg-cursor-hover");
      } else {
        pointer.classList.remove("rg-cursor-hover");
      }
    };
    document.addEventListener("pointermove",onMove,{passive:true,capture:true});
    document.addEventListener("pointerleave",() => {
      pointer.style.left="-100px"; spotlight.style.left="-1000px";
    },{passive:true});
    document.addEventListener("pointerdown",() => pointer.classList.add("rg-cursor-hover"),{passive:true});
    document.addEventListener("pointerup",() => pointer.classList.remove("rg-cursor-hover"),{passive:true});
    window.__rogueGuardPointerBound = true;
  };

  if (document.body) start();
  else document.addEventListener("DOMContentLoaded",start,{once:true});
})();
</script>
